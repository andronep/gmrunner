name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build gmrunner for Android (ARM64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;26.3.11579264
            cmake;3.22.1

      - name: Download SDL2 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p third_party/SDL2
          curl --fail --location --retry 3 \
            https://www.libsdl.org/release/SDL2-2.32.10.tar.gz \
            --output /tmp/SDL2-2.32.10.tar.gz
          tar -xzf /tmp/SDL2-2.32.10.tar.gz \
            --strip-components=1 \
            -C third_party/SDL2
          test -f third_party/SDL2/CMakeLists.txt

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: gmrunner-android-arm64
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
